name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Run tests
        run: python tools/test.py
      - name: Compile Python sources
        run: python -m compileall -q packages apps examples

  release-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        smoke-kind: ["base", "numpy"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Run release smoke checks
        if: matrix.smoke-kind == 'base'
        run: python tools/release_smoke.py --wheelhouse build/wheels
      - name: Validate optional NumPy backend boundary
        if: matrix.smoke-kind == 'numpy'
        run: python tools/release_smoke.py --wheelhouse build/numpy-wheels --with-numpy
