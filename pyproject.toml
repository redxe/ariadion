[project]
name = "ariadion-workspace"
version = "0.1.0"
description = "Ariadion quantum programming platform workspace"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.uv.workspace]
members = [
  "packages/*",
  "apps/cli",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
