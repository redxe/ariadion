[project]
name = "daidalon"
version = "0.1.0rc3"
description = "Compiler and synthesis engine for Ariadion"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Vi Connelly"}]
requires-python = ">=3.11"
dependencies = [
  "ariadion-core==0.1.0rc3",
  "ariadion-language==0.1.0rc3",
  "ariadion-ir==0.1.0rc3",
  "ariadion-semantics==0.1.0rc3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/redxe/ariadion"
Repository = "https://github.com/redxe/ariadion"
Issues = "https://github.com/redxe/ariadion/issues"
Changelog = "https://github.com/redxe/ariadion/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
