[project]
name = "daidalon"
version = "0.1.0"
description = "Compiler and synthesis engine for Ariadion"
requires-python = ">=3.11"
dependencies = ["ariadion-core", "ariadion-language", "ariadion-ir", "ariadion-semantics"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
