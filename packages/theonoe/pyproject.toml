[project]
name = "theonoe"
version = "0.1.0rc1"
description = "Inspection and debugging engine for Ariadion"
requires-python = ">=3.11"
dependencies = ["ariadion-core==0.1.0rc1", "ariadion-noise==0.1.0rc1", "ariadion-semantics==0.1.0rc1", "ariadion-simulator==0.1.0rc1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
