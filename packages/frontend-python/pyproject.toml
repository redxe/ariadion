[project]
name = "ariadion-frontend-python"
version = "0.1.0rc1"
description = "Safe Python AST capture for Ariadion quantum functions"
requires-python = ">=3.11"
dependencies = [
  "ariadion-core==0.1.0rc1",
  "ariadion-language==0.1.0rc1",
  "ariadion-semantics==0.1.0rc1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
