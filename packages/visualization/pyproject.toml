[project]
name = "ariadion-visualization"
version = "0.1.0"
description = "Circuit and state visualizations for Ariadion"
requires-python = ">=3.11"
dependencies = ["ariadion-ir"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
