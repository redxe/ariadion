[project]
name = "ariadion-syntax"
version = "0.1.0rc1"
description = "Immutable native-source syntax contracts for Ariadion"
requires-python = ">=3.11"
dependencies = ["ariadion-core==0.1.0rc1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
