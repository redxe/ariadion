[project]
name = "ariadion"
version = "0.1.0rc1"
description = "Python SDK for visible, basis-aware quantum programming"
requires-python = ">=3.11"
dependencies = [
  "ariadion-frontend-python==0.1.0rc1",
  "ariadion-language==0.1.0rc1",
  "ariadion-noise==0.1.0rc1",
  "ariadion-runtime==0.1.0rc1",
  "ariadion-semantics==0.1.0rc1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
