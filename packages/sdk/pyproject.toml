[project]
name = "ariadion"
version = "0.1.0"
description = "Python SDK for visible, basis-aware quantum programming"
requires-python = ">=3.11"
dependencies = ["ariadion-language", "ariadion-runtime"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
