[project]
name = "ariadion-semantics"
version = "0.1.0"
description = "Pre-allocation logical quantum semantics for Ariadion"
requires-python = ">=3.11"
dependencies = ["ariadion-core", "ariadion-language"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
