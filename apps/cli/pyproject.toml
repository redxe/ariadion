[project]
name = "ariadion-cli"
version = "0.1.0"
description = "Command line interface for Ariadion"
requires-python = ">=3.11"
dependencies = ["ariadion", "ariadion-visualization"]

[project.scripts]
ariadion = "ariadion_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
